{% extends "base.html" %}{% import "_ui.html" as ui %}
{% block title %}{{ e.code }} - Forum{% endblock %}
{% block content %}
<div class="error-page">
<div class="code">{{ e.code }}</div>
<h1>{{ e.name }}</h1>
<p>{{ e.description }}{% if e.code == 400 %} Reload the page and try again.{% endif %}</p>
<a class="btn primary" href="{{ url_for('index') }}">Back to threads</a>
</div>
{% endblock %}
